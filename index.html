<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <meta name="theme-color" content="#020a0d" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><path d=%22M16 2 29 9v14l-13 7L3 23V9z%22 fill=%22none%22 stroke=%22%2341ffe6%22 stroke-width=%222%22/><circle cx=%2216%22 cy=%2216%22 r=%224%22 fill=%22%23ffcf45%22/></svg>" />
    <title>VECTOR CRAWLER</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="VECTOR CRAWLER game canvas"></canvas>
      <div id="scan-flash"></div>
      <div id="hud" class="hidden">
        <section class="hud-block status">
          <div class="label-row"><span>INTEGRITY</span><span id="health-text">100</span></div>
          <div class="bar"><i id="health-bar"></i></div>
          <div class="label-row"><span>ENERGY</span><span id="energy-text">100</span></div>
          <div class="bar energy"><i id="energy-bar"></i></div>
          <div class="tiny">WEAPON // PULSE ARRAY</div>
        </section>
        <section class="hud-block mission">
          <strong id="timer">03:00</strong>
          <span>SCORE <b id="score">000000</b></span>
          <span>HOSTILES <b id="enemies">0</b></span>
          <span>SCAN <b id="scan-status">READY</b></span>
        </section>
        <div id="lock-label">NO LOCK</div>
        <div id="crosshair"><i></i><i></i><i></i><i></i></div>
        <div id="warning"></div>
        <div id="fps"></div>
      </div>
      <div id="touch-controls" class="hidden">
        <div id="move-zone" class="touch-zone"><div id="move-stick"></div></div>
        <div id="aim-zone" class="touch-zone"></div>
        <div class="touch-buttons">
          <button data-action="fire">FIRE</button>
          <button data-action="lock">LOCK</button>
          <button data-action="boost">SLIDE</button>
          <button data-action="jump">JUMP</button>
          <button data-action="scan">SCAN</button>
        </div>
      </div>
      <main id="title-screen" class="overlay">
        <p class="eyebrow">NEURAL DEFENSE INCURSION // 01</p>
        <h1>VECTOR<br /><em>CRAWLER</em></h1>
        <p class="lead">四脚走行メカで円筒防衛網を突破せよ。<br />壁も天井も、すべてが走路になる。</p>
        <button id="start-button" class="primary">START INCURSION</button>
        <div class="controls">
          <span>WASD 移動</span><span>マウス 照準</span><span>クリック 射撃</span>
          <span>右クリック ロック</span><span>Shift スライド</span><span>F スキャン</span>
        </div>
        <div class="settings">
          <label><input id="low-mode" type="checkbox" /> 低性能モード</label>
          <label>音量 <input id="volume" type="range" min="0" max="1" step="0.05" value="0.35" /></label>
          <button id="mute-button">SOUND ON</button>
        </div>
      </main>
      <section id="pause-screen" class="overlay hidden">
        <h2>PAUSED</h2><p>Escapeで再開</p>
      </section>
      <section id="result-screen" class="overlay hidden">
        <p id="result-kicker" class="eyebrow"></p>
        <h2 id="result-title"></h2>
        <div id="result-stats"></div>
        <button id="retry-button" class="primary">RETRY</button>
      </section>
      <div id="error-screen" class="overlay hidden"><h2>起動エラー</h2><pre id="error-message"></pre></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
